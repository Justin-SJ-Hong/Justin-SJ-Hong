name: Generate GitHub Readme Stats (Official)

on:
  schedule:
    # 매일 자정(KST 기준 오전 9시)에 자동 갱신
    - cron: "0 0 * * *"
  workflow_dispatch: # Actions 탭에서 수동 실행 가능

jobs:
  generate-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ⚡ npm 캐시 (다운로드 시간 단축)
      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-grs-npm-v1
          restore-keys: |
            ${{ runner.os }}-grs-npm-

      - name: Run Official GRS Server and Generate SVGs
        env:
          PAT_1: ${{ secrets.PROFILE_STATS_TOKEN }}
        run: |
          echo "1. 공식 anuraghazra 레포 클론 및 의존성 설치"
          git clone --depth 1 https://github.com/anuraghazra/github-readme-stats.git /tmp/grs
          cd /tmp/grs

          npm install --prefer-offline
          npm install express --prefer-offline

          echo "2. 백그라운드 Express 서버 완전 분리 구동"
          # stdout/stderr 스트림을 파일로 리다이렉트하여 Actions 러너 멈춤 현상 차단
          PORT=3000 nohup node express.js > /tmp/server.log 2>&1 < /dev/null &
          disown

          echo "3. 서버 기동 상태 확인 중..."
          for i in {1..30}; do
            if curl -s http://localhost:3000/api > /dev/null 2>&1; then
              echo "Server is ready!"
              break
            fi
            sleep 1
          done

          echo "4. SVG 카드 생성 및 다운로드"
          cd "$GITHUB_WORKSPACE"
          mkdir -p profile

          # My Stat 카드 생성
          curl -f -s -S --max-time 60 "http://localhost:3000/api?username=Justin-SJ-Hong&show_icons=true&theme=tokyonight&count_private=true" -o profile/stats.svg

          # Top Languages 카드 생성 (공식 layout=pie)
          curl -f -s -S --max-time 60 "http://localhost:3000/api/top-langs?username=Justin-SJ-Hong&layout=pie&theme=tokyonight&exclude_repo=sparta,devops&include_all_commits=true&count_private=true&langs_count=20&hide=hack,plpgsql" -o profile/top-langs.svg

          echo "5. 로컬 서버 완전 종료"
          pkill -9 -f "node express.js" || true

      # 6. 생성된 카드 자동 커밋 및 푸시
      - name: Commit & Push generated cards
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update official readme stats cards"
          file_pattern: "profile/*.svg"

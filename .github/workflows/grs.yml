name: Generate GitHub Readme Stats (Official)

on:
  schedule:
    # 매일 자정(KST 기준 오전 9시)에 자동 갱신
    - cron: "0 0 * * *"
  workflow_dispatch: # Actions 탭에서 수동 실행 가능

jobs:
  generate-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ⚡ npm 글로벌 캐시 디렉터리 캐싱 (매 실행 시 다운로드 속도 대폭 단축)
      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-grs-npm-${{ hashFiles('/tmp/grs/package.json') }}
          restore-keys: |
            ${{ runner.os }}-grs-npm-

      - name: Run Official GRS Server and Generate SVGs
        env:
          PAT_1: ${{ secrets.PROFILE_STATS_TOKEN }}
        run: |
          # 1. 임시 디렉토리에 공식 anuraghazra 레포 클론 및 의존성 설치
          git clone --depth 1 https://github.com/anuraghazra/github-readme-stats.git /tmp/grs
          cd /tmp/grs

          # 캐시된 npm을 활용하여 설치 (--prefer-offline으로 캐시 우선 사용)
          npm install --prefer-offline
          npm install express --prefer-offline

          # 2. 로컬 Express 서버 백그라운드 구동 (공식 지원 모드)
          PORT=3000 node express.js &
          SERVER_PID=$!

          # 3. 로컬 서버 준비 대기 (최대 30초)
          echo "Waiting for official GRS server to start..."
          for i in {1..30}; do
            if curl -s http://localhost:3000/api > /dev/null 2>&1; then
              echo "Server is ready!"
              break
            fi
            sleep 1
          done

          # 4. 프로필 저장소 루트로 돌아와 SVG 파일 추출
          cd "$GITHUB_WORKSPACE"
          mkdir -p profile

          # My Stat 카드 생성 (Private 포함)
          curl -f -s -S "http://localhost:3000/api?username=Justin-SJ-Hong&show_icons=true&theme=tokyonight&count_private=true" -o profile/stats.svg

          # Top Languages 카드 생성 (공식 원본 layout=pie 적용, Private 포함, 불필요한 언어 숨김)
          curl -f -s -S "http://localhost:3000/api/top-langs?username=Justin-SJ-Hong&layout=pie&theme=tokyonight&exclude_repo=sparta,devops&include_all_commits=true&count_private=true&langs_count=20&hide=hack,plpgsql" -o profile/top-langs.svg

          # 5. 임시 서버 종료
          kill $SERVER_PID || true

      # 6. 생성된 카드 자동 커밋 및 푸시
      - name: Commit & Push generated cards
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update official readme stats cards"
          file_pattern: "profile/*.svg"
